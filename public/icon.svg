<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e1e2e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#11111b;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="coreGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#818cf8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#38bdf8;stop-opacity:1" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Outer Container (macOS style squircle) -->
  <rect width="512" height="512" rx="120" fill="url(#bgGrad)" />
  
  <!-- Subtle Inner Ring -->
  <rect x="20" y="20" width="472" height="472" rx="110" fill="none" stroke="white" stroke-opacity="0.05" stroke-width="2" />
  
  <!-- The Technological Core (Pulse Graphic) -->
  <g transform="translate(256, 256)">
    <!-- Main Glow -->
    <circle r="120" fill="url(#coreGrad)" opacity="0.1" filter="url(#glow)" />
    
    <!-- Central Hexagon Icon -->
    <path d="M0 -110 L95.26 -55 L95.26 55 L0 110 L-95.26 55 L-95.26 -55 Z" 
          fill="none" 
          stroke="url(#coreGrad)" 
          stroke-width="24" 
          stroke-linejoin="round"
          stroke-linecap="round" />
          
    <!-- Inner Monitor Pulse -->
    <path d="M-50 0 L-20 0 L-10 -30 L10 30 L20 0 L50 0" 
          fill="none" 
          stroke="white" 
          stroke-width="16" 
          stroke-linecap="round" 
          stroke-linejoin="round"
          stroke-opacity="0.9" />
          
    <!-- Floating Data Points -->
    <circle cx="0" cy="-60" r="8" fill="white" fill-opacity="0.8" />
    <circle cx="52" cy="30" r="8" fill="white" fill-opacity="0.5" />
    <circle cx="-52" cy="30" r="8" fill="white" fill-opacity="0.5" />
  </g>
  
  <!-- Top Glass Highlight -->
  <path d="M120 40 Q256 20 392 40 Q472 60 472 160 Q472 80 392 80 Q256 60 120 80 Q40 80 40 160 Q40 60 120 40" 
        fill="white" 
        fill-opacity="0.05" />
</svg>
