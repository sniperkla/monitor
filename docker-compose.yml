services:
  monitor:
    build:
      context: .
      dockerfile: Dockerfile
    image: monitor:latest
    container_name: monitor
    restart: unless-stopped
    stop_signal: SIGTERM
    stop_grace_period: 15s   # Give server.js time to write interrupted status to DB on shutdown
    depends_on:
      - monitor-mongo
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 3030
      MONGODB_URI: mongodb://monitor:AaBb1234!@monitor-mongo:27017/monitor?authSource=admin
      NEXTAUTH_URL: https://monitor.eaqdragon.com
      NEXT_PUBLIC_APP_URL: https://monitor.eaqdragon.com
    networks:
      - proxy-net

  monitor-mongo:
    image: mongo:7
    container_name: monitor-mongo
    restart: unless-stopped
    ports:
      - "27021:27017"

    environment:
      MONGO_INITDB_ROOT_USERNAME: monitor
      MONGO_INITDB_ROOT_PASSWORD: AaBb1234!
      MONGO_INITDB_DATABASE: monitor
    volumes:
      - mongo_data:/data/db
    networks:
      - proxy-net
    # No ports exposed to the host machine to avoid "port already in use" crashes.

volumes:
  mongo_data:

networks:
  proxy-net:
    external: true
