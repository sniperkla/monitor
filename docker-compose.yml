services:
  monitor:
    build:
      context: .
      dockerfile: Dockerfile
    image: monitor:latest
    container_name: monitor
    restart: unless-stopped
    stop_signal: SIGTERM
    stop_grace_period: 15s # Give server.js time to write interrupted status to DB on shutdown
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 3030
      MONGODB_URI: mongodb://monitor:${MONGO_PASSWORD}@monitor-mongo:27017/monitor?authSource=admin
      # Passed through explicitly: server.js reads it to provision the Swarm
      # mongo service. env_file alone does not cover values supplied via the
      # shell environment rather than the .env file.
      MONGO_PASSWORD: ${MONGO_PASSWORD}
    networks:
      - proxy-net

  monitor-mongo:
    image: mongo:7.0
    container_name: monitor-mongo
    restart: unless-stopped
    ports:
      # Bound to loopback only. The app reaches Mongo over the internal
      # proxy-net network (monitor-mongo:27017); the host port exists purely
      # for local administration, so it must not be reachable from the internet.
      # To use a GUI client, tunnel it: ssh -L 27021:127.0.0.1:27021 <host>
      - "127.0.0.1:27021:27017"

    environment:
      MONGO_INITDB_ROOT_USERNAME: monitor
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
      MONGO_INITDB_DATABASE: monitor
    volumes:
      - mongo_data:/data/db
    networks:
      - proxy-net
    # Host port is bound to 127.0.0.1 (see above) to avoid exposing the
    # database to the internet while still allowing local administration.

volumes:
  mongo_data:

networks:
  proxy-net:
    external: true
