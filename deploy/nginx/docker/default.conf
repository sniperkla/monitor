# nginx, running as its own container on the external `proxy-net` network.
#
# The upstream port must match the port the app actually listens on inside its
# container. That is 3030, not Next.js's 3000 default: the Dockerfile sets
# ENV PORT=3030 and docker-compose.yml sets PORT: 3030, and compose's
# `environment` overrides `env_file`, so PORT=3030 always wins in Docker.
#
# This file said 3000 until it was fixed — it was written on 2026-08-16, three
# months after the app moved to 3030 (977db5a9, 2026-05-30), and a fresh deploy
# would have proxied to a port nothing was listening on: 502 on every request.
#
# If you change the port, change all three together: Dockerfile ENV PORT,
# docker-compose.yml PORT, and the upstreams below.
server {
    listen 80;
    server_name monitor.eaqdragon.com;

    client_max_body_size 200M;

    location /api/socket/ {
        proxy_pass http://monitor:3030;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600;
        proxy_send_timeout 3600;
        proxy_buffering off;
    }

    # Monitor Agent WebSocket — must have long timeout (agents stay connected)
    location /agent-ws {
        proxy_pass http://monitor:3030;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
        proxy_buffering off;
    }

    # Relay WebSocket — must have long timeout
    location /relay-ws {
        proxy_pass http://monitor:3030;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
        proxy_buffering off;
    }

    location / {
        proxy_pass http://monitor:3030;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300;
        proxy_send_timeout 300;
    }
}
